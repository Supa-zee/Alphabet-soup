<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alphabet Soup">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html { background: #0F6A70; }
</style>
<title>Alphabet Soup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Spell words in the soup pot and feed the hungry customers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Shrikhand&display=swap">
<style>
/* Layout: one phone screen, read top to bottom like a lunch counter: customer at the counter, order on the wall, pot on the stove.
   A single painted-kitchen look on purpose; the wall colours change with the soup she is cooking. */
:root {
  color-scheme: light;
  --tile-a: #0F6A70; --tile-b: #0C5C63;
  --counter: #F5B82E; --counter-edge: #C98A12;
  --stove: #23262E; --stove-2: #33373F;
  --enamel: #FFF7E2; --ink: #2C1A10;
  --pasta: #FFD977; --pasta-deep: #E9A92F;
  --cherry: #E0352F; --cherry-deep: #A81F1E;
  --mint: #4FD08A; --slot: rgba(4, 40, 44, .42);
  --on-wall: #FFF7E2;
  --side: max(12px, calc((100vw - 520px) / 2));
  --display: "Shrikhand", "Arial Rounded MT Bold", Georgia, serif;
  --noodle: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: clip; margin: 0; }
body {
  background: conic-gradient(var(--tile-a) 25%, var(--tile-b) 0 50%, var(--tile-a) 0 75%, var(--tile-b) 0) 0 0 / 64px 64px;
  background-color: var(--tile-a);
  color: var(--on-wall); font-family: var(--body); font-weight: 700; font-size: 17px; line-height: 1.25;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.screen { height: 100%; width: 100%; max-width: 520px; margin: 0 auto; }

/* ---------- Home ---------- */
#home {
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 16px;
}
#home[hidden] { display: none !important; }
.logo { font-family: var(--display); font-weight: 400; text-align: center; margin: 0; line-height: .92; color: var(--pasta);
  font-size: clamp(2.6rem, min(10.5vh, 16.5vw), 4.8rem); text-shadow: 0 4px 0 var(--cherry-deep), 0 7px 0 rgba(0,0,0,.25); transform: rotate(-3deg); }
.logo span { display: block; color: var(--enamel); font-size: .78em; }
#homePot { position: relative; flex: 1 1 auto; min-height: 140px; width: 100%; display: grid; place-items: center; }
.menu { display: grid; gap: 10px; width: 100%; }
.menu .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70px; width: 100%;
  padding: 8px 14px; border-radius: 22px; background: var(--cherry); color: var(--enamel); font-weight: 800; font-size: 1.55rem; line-height: 1.05;
  box-shadow: 0 6px 0 var(--cherry-deep);
}
.big small { font-size: .95rem; font-weight: 700; opacity: .92; }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cherry-deep); }
.big.alt { background: var(--enamel); color: var(--ink); font-size: 1.15rem; box-shadow: 0 6px 0 #C8B78C; min-height: 74px; }
.big.alt:active { box-shadow: 0 2px 0 #C8B78C; }
.big.alt small { color: #6B5238; }
.big.done { opacity: .78; }
.toggles { display: flex; gap: 8px; justify-content: center; width: 100%; }
.tog { min-height: 44px; padding: 4px 16px; border-radius: 22px; background: rgba(0,0,0,.28); font-size: 1rem; color: var(--on-wall); }
.tog[aria-pressed="false"] { opacity: .62; text-decoration: line-through; }

/* ---------- Game ---------- */
#game { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; max-width: none; }
#game[hidden] { display: none !important; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 46px;
  padding-left: max(var(--side), env(safe-area-inset-left, 0px)); padding-right: max(var(--side), env(safe-area-inset-right, 0px)); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 2px 14px; border-radius: 18px; background: rgba(0,0,0,.3); color: var(--on-wall); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
#barTitle { font-family: var(--display); font-weight: 400; font-size: 1.3rem; color: var(--pasta); white-space: nowrap; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE99A, #F2B321 70%); box-shadow: inset 0 0 0 2px #C98A12; flex: none; }
#coinPill.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.18); } }

.counter { position: relative; height: 104px; display: flex; align-items: flex-end; gap: 6px;
  padding-left: max(var(--side), env(safe-area-inset-left, 0px)); padding-right: max(var(--side), env(safe-area-inset-right, 0px)); }
.counter::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 15px; background: var(--counter); border-top: 3px solid #FFE08A; box-shadow: 0 4px 0 var(--counter-edge), 0 8px 12px rgba(0,0,0,.25); z-index: 2; }
#cust { position: relative; width: 98px; height: 96px; flex: none; z-index: 1; }
#cust svg { width: 100%; height: 100%; display: block; }
#cust.in { animation: custIn .42s cubic-bezier(.2,1.4,.5,1); }
@keyframes custIn { from { transform: translateX(-110%) rotate(-8deg); } }
#cust.happy { animation: hop .5s; }
@keyframes hop { 30% { transform: translateY(-10px) rotate(3deg); } 60% { transform: translateY(0) rotate(-2deg); } }
.say { position: relative; z-index: 3; flex: 1 1 auto; min-width: 0; align-self: center; margin-bottom: 18px; padding: 7px 13px; min-height: 58px; display: flex; align-items: center;
  background: var(--enamel); color: var(--ink); border-radius: 18px; font-size: 1.02rem; line-height: 1.15; }
.say::before { content: ""; position: absolute; left: -9px; bottom: 16px; border: 9px solid transparent; border-left: 0; border-right-color: var(--enamel); }
.say b { color: var(--cherry-deep); font-weight: 800; }
[data-mood] .e-h, [data-mood] .m-o, [data-mood] .m-u { display: none; }
[data-mood="happy"] .e-o { display: none; } [data-mood="happy"] .e-h { display: inline; }
[data-mood="eat"] .e-o { display: none; } [data-mood="eat"] .e-h { display: inline; }
[data-mood="eat"] .m-s { display: none; } [data-mood="eat"] .m-o { display: inline; animation: chew .28s infinite alternate; }
[data-mood="oops"] .m-s { display: none; } [data-mood="oops"] .m-u { display: inline; }
.e-o, .m-o { transform-box: fill-box; transform-origin: center; }
[data-mood="idle"] .e-o { animation: blink 4.2s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.1); } }
@keyframes chew { to { transform: scaleY(.3); } }

.kitchen { position: relative; min-height: 0; padding-block: 16px 2px; padding-left: max(var(--side), env(safe-area-inset-left, 0px)); padding-right: max(var(--side), env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
#board { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-content: center; }
#game.rush #board { display: none; }
#grid { display: grid; }
.cell { display: grid; place-items: center; border-radius: 22%; background: var(--slot); box-shadow: inset 0 2px 0 rgba(0,0,0,.2); font-family: var(--noodle); color: var(--ink); line-height: 1; }
.cell.void { background: none; box-shadow: none; }
.cell.on { background: var(--pasta); box-shadow: inset 0 -4px 0 var(--pasta-deep); }
.cell.pop { animation: pop .34s cubic-bezier(.2,1.7,.5,1); }
.cell.flash { animation: flash .5s; }
@keyframes pop { from { transform: scale(.3); } }
@keyframes flash { 40% { background: #fff; transform: scale(1.1); } }

#rushPanel { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; gap: 8px; }
#game.rush #rushPanel { display: flex; }
.clock { height: 26px; border-radius: 13px; background: var(--slot); overflow: hidden; position: relative; flex: none; }
#clockFill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--cherry), var(--counter)); border-radius: 13px; transform-origin: left; }
#clockText { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.65); font-variant-numeric: tabular-nums; }
.rushCount { text-align: center; font-size: 1.05rem; flex: none; }
.rushCount b { font-family: var(--display); font-weight: 400; font-size: 2.1rem; color: var(--pasta); line-height: 1; margin-right: 4px; }
#tickets { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 6px; }
.ticket { background: var(--enamel); color: var(--ink); padding: 2px 11px; border-radius: 6px; font-family: var(--noodle); font-size: 1.15rem; letter-spacing: .04em; animation: pop .25s; }

.chipRow { position: relative; z-index: 4; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; padding-inline: 12px; flex: none; }
#chip { min-height: 46px; max-width: 100%; padding: 2px 18px; border-radius: 23px; display: flex; align-items: center; justify-content: center; background: var(--enamel); color: var(--ink); font-family: var(--noodle); font-size: 1.85rem; letter-spacing: .06em; line-height: 1; }
#chip.idle { background: rgba(0,0,0,.26); color: var(--on-wall); font-family: var(--body); font-size: 1.05rem; letter-spacing: 0; font-weight: 700; }
#chip.good { background: var(--mint); }
#chip.bonus { background: var(--pasta); }
#chip.bad { background: #F7A6A0; animation: shake .36s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.mini { min-height: 46px; padding: 0 14px; border-radius: 23px; font-weight: 800; }
.mini.serve { background: var(--mint); color: #083A21; }
.mini.clear { background: rgba(0,0,0,.34); color: var(--on-wall); }

.station { position: relative; background: linear-gradient(var(--stove-2), var(--stove)); border-top: 4px solid #4A4F59;
  padding-top: 8px; padding-bottom: 10px; padding-left: max(var(--side), env(safe-area-inset-left, 0px)); padding-right: max(var(--side), env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 66px minmax(0, 1fr) 66px; align-items: center; gap: 2px; }
.tools { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.tool { position: relative; width: 64px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 16px; background: #444A55; color: #FFF7E2; font-size: .86rem; line-height: 1; padding: 6px 2px; }
.tool svg { width: 32px; height: 32px; }
.tool:active { background: #5B6271; transform: scale(.95); }
.tool .cost { display: inline-flex; align-items: center; gap: 3px; color: #FFD977; font-variant-numeric: tabular-nums; }
.tool .cost i { width: 11px; height: 11px; border-radius: 50%; background: #F2B321; display: inline-block; }
.tool.jar { background: transparent; cursor: default; }
#game.rush .needsBoard { visibility: hidden; }
#potBox { position: relative; display: grid; place-items: center; justify-self: center; touch-action: none; }
.pot { position: relative; touch-action: none; }
.pot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.l { position: absolute; left: 0; top: 0; display: grid; place-items: center; font-family: var(--noodle); line-height: 1; color: var(--soup-pasta, #FFE29A); pointer-events: none; will-change: transform;
  text-shadow: 2px 0 0 #3B1D0E, -2px 0 0 #3B1D0E, 0 2px 0 #3B1D0E, 0 -2px 0 #3B1D0E, 2px 2px 0 #3B1D0E, -2px 2px 0 #3B1D0E, 2px -2px 0 #3B1D0E, -2px -2px 0 #3B1D0E, 0 5px 0 rgba(40,15,5,.55); }
.l.sel { color: #fff; }
.l.wob { animation: shake .36s; }

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.fly { position: absolute; left: 0; top: 0; font-family: var(--noodle); color: var(--ink); background: var(--pasta); border-radius: 22%; display: grid; place-items: center; will-change: transform; }
.fall { position: absolute; left: 0; top: 0; font-family: var(--noodle); color: var(--pasta); text-shadow: 0 2px 0 #3B1D0E; }
.shout { position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%); font-family: var(--display); color: var(--pasta); font-size: clamp(2.4rem, 12vw, 3.6rem); white-space: nowrap; text-shadow: 0 3px 0 var(--cherry-deep), 0 6px 0 rgba(0,0,0,.3); }

/* ---------- Cards ---------- */
#card { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(5, 25, 28, .66);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#card[hidden] { display: none !important; }
.sheet { width: 100%; max-width: 400px; max-height: 100%; overflow: auto; background: var(--enamel); color: var(--ink); border-radius: 26px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; text-align: center; animation: sheet .34s cubic-bezier(.2,1.3,.5,1); box-shadow: 0 10px 0 rgba(0,0,0,.25); }
@keyframes sheet { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1.05; color: var(--cherry-deep); text-wrap: balance; }
.sheet p { margin: 0; font-size: 1.1rem; }
.sheet .face { width: 104px; height: 100px; margin: 0 auto -4px; }
.rows { display: grid; gap: 2px; font-size: 1.1rem; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.rows .total { border-top: 3px dotted #CDB98F; margin-top: 4px; padding-top: 4px; font-weight: 800; font-size: 1.3rem; }
.newsoup { display: flex; align-items: center; gap: 12px; text-align: left; background: #FFE9B0; border-radius: 16px; padding: 8px 12px; font-size: 1.02rem; }
.newsoup b { display: block; font-size: 1.15rem; }
.dish { width: 54px; height: 54px; border-radius: 50%; flex: none; border: 5px solid #E8EDF1; box-shadow: 0 0 0 2px #9BA6AF; }

/* ---------- Recipe book ---------- */
#book { display: flex; flex-direction: column; }
#book[hidden] { display: none !important; }
#book .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 24px; display: flex; flex-direction: column; gap: 14px; }
#book h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2.1rem; color: var(--pasta); text-shadow: 0 3px 0 var(--cherry-deep); }
.soups { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.soup { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 20px; background: var(--enamel); color: var(--ink); text-align: center; min-height: 142px; }
.soup .dish { width: 62px; height: 62px; }
.soup b { font-size: 1.1rem; line-height: 1.1; }
.soup span { font-size: .95rem; font-weight: 600; line-height: 1.12; color: #5F4731; }
.soup.cur { box-shadow: 0 0 0 4px var(--cherry); }
.soup.locked { background: rgba(0,0,0,.28); color: var(--on-wall); cursor: default; }
.soup.locked span { color: var(--on-wall); }
.soup.locked .dish { filter: grayscale(1) brightness(.55); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats div { background: rgba(0,0,0,.28); border-radius: 16px; padding: 8px 12px; font-size: .98rem; }
.stats b { display: block; font-size: 1.5rem; font-weight: 800; color: var(--pasta); line-height: 1.1; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

@media (max-height: 740px) {
  .bar { height: 42px; }
  .counter { height: 84px; }
  #cust { width: 80px; height: 78px; }
  .say { margin-bottom: 17px; min-height: 50px; padding-block: 4px; font-size: .96rem; }
  .kitchen { padding-block: 13px 0; }
  .chipRow { height: 46px; }
  #chip, .mini { min-height: 42px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>

</head>
<body>
<div id="home" class="screen">
  <h1 class="logo">Alphabet<span>Soup</span></h1>
  <div id="homePot" aria-hidden="true"></div>
  <div class="menu">
    <button class="big" id="playBtn"><span id="playLabel">Open the Kitchen</span><small id="playSub">Your first customer is waiting</small></button>
    <div class="two">
      <button class="big alt" id="dailyBtn"><span>Soup of the Day</span><small id="dailySub">New every day</small></button>
      <button class="big alt" id="bookBtn"><span>Recipe Book</span><small id="bookSub">1 of 8 soups</small></button>
    </div>
  </div>
  <div class="toggles">
    <button class="tog" id="musicBtn" aria-pressed="true">Music</button>
    <button class="tog" id="sfxBtn" aria-pressed="true">Sounds</button>
  </div>
</div>

<div id="game" class="screen" hidden>
  <div class="bar">
    <button class="pill" id="menuBtn">Menu</button>
    <div id="barTitle">Bowl 1</div>
    <div class="pill" id="coinPill" aria-label="Tips"><i class="coin"></i><span id="coins">100</span></div>
  </div>
  <div class="counter">
    <div id="cust"></div>
    <div class="say" id="say" aria-live="polite"></div>
  </div>
  <div class="kitchen">
    <div id="board"><div id="grid"></div></div>
    <div id="rushPanel">
      <div class="clock"><div id="clockFill"></div><div id="clockText">1:15</div></div>
      <div class="rushCount"><b id="rushN">0</b>served</div>
      <div id="tickets"></div>
    </div>
  </div>
  <div class="station">
    <div class="tools">
      <button class="tool" id="stirBtn" aria-label="Stir the pot to move the letters">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 19c0-6 6-10 12-9 5 .8 8 5 6 9-2 3-7 3-9 0"/><path d="M21 4l-3 5m0 0l-4-1m4 1l1 4"/></svg>
        <span>Stir</span>
      </button>
      <div class="tool jar needsBoard" aria-label="Extra words jar">
        <svg viewBox="0 0 32 32"><rect x="8" y="3" width="16" height="5" rx="1.5" fill="#E0352F"/><rect x="6" y="9" width="20" height="20" rx="4" fill="#FFF7E2" opacity=".25"/><rect id="jarFill" x="6" y="29" width="20" height="0" rx="3" fill="#F5B82E"/><rect x="6" y="9" width="20" height="20" rx="4" fill="none" stroke="#FFF7E2" stroke-width="2"/></svg>
        <span>Extras</span>
        <span class="cost"><b id="jarN">0/5</b></span>
      </div>
    </div>
    <div id="potBox"></div>
    <div class="tools">
      <button class="tool needsBoard" id="pepperBtn" aria-label="Pepper: reveal one letter for 20 tips">
        <svg viewBox="0 0 32 32"><path d="M11 13h10l2 15a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2z" fill="#FFF7E2"/><path d="M12 13c0-6 1-9 4-9s4 3 4 9z" fill="#B6BEC8"/><g fill="#3A3F49"><circle cx="14.5" cy="8" r="1"/><circle cx="17.5" cy="8" r="1"/><circle cx="16" cy="5.5" r="1"/></g><text x="16" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#2C1A10">P</text></svg>
        <span>Letter</span>
        <span class="cost"><i></i>20</span>
      </button>
      <button class="tool needsBoard" id="ladleBtn" aria-label="Ladle: reveal one whole word for 60 tips">
        <svg viewBox="0 0 32 32" fill="none"><path d="M24 3c-1 6-3 11-6 14" stroke="#B6BEC8" stroke-width="3.4" stroke-linecap="round"/><path d="M5 17h19c0 7-4 12-9.500 12S5 24 5 17z" fill="#B6BEC8"/><path d="M8 19.500h13c-.6 3.800-3 6.500-6.500 6.500S8.700 23.300 8 19.500z" fill="#F5B82E"/></svg>
        <span>Word</span>
        <span class="cost"><i></i>60</span>
      </button>
    </div>
  </div>
</div>

  $("game").classList.remove("rush");
  const lv = parse(raw), p = G.prog[key] || {};
  R = { mode, key, lv, found: new Set(p.f || []), rev: new Set(p.r || []), bonus: new Set(p.b || []), hints: p.h || 0, cust, over: false };
  setupRun();
  $("barTitle").textContent = title;
  let chars; do { chars = shuffle([...lv.seed]); } while (chars.join("") === lv.seed);
  pot.setLetters(chars);
  fit(); renderBoard();
  showCust(cust); say(esc(rnd(cust.hi))); idleChip();
  Sound.ding();
  if (mode === "bowl" && G.level === 1 && !R.found.size && !G.helped) {
    const w = lv.words.slice().sort((a, b) => a.w.length - b.w.length)[0], used = new Set();
    const idx = [...w.w].map(ch => { const i = chars.findIndex((c, n) => c === ch && !used.has(n)); used.add(i); return i; });
    pot.demo = { idx, t0: performance.now() + 900 };
  }
  checkDone();
}
function startBowl() {
  const i = (G.level - 1) % DATA.L.length;
  startFrom("bowl", "L" + G.level, DATA.L[i], "Bowl " + G.level, custFor(G.level));
}
function dailyIndex() { const t = today(); let h = 7; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % DATA.D.length; }
function startDaily() {
  if (G.daily.last === today()) return;
  startFrom("daily", "D" + today(), DATA.D[dailyIndex()], "Today's Soup", CAST[dailyIndex() % CAST.length]);
}
function rushOffer() {
  $("game").classList.remove("rush");
  card(`<h2>Lunch Rush!</h2><p>A whole crowd just walked in. Spell any word you can in ${RUSH_SECONDS} seconds and every word feeds someone. Long words add time to the clock.</p>`, [
    { label: "Open the Doors", fn: startRush }, { label: "Not today", alt: true, fn: () => { G.rushAfter = G.level - 1; save(); startBowl(); } }
  ]);
}
function startRush() {
  G.rushAfter = G.level - 1; save();
  const seed = rnd(DATA.R);
  showScreen("game"); $("game").classList.add("rush");
  R = { mode: "rush", used: new Set(), served: 0, tips: 0, end: performance.now() + RUSH_SECONDS * 1000, over: false, cust: rnd(CAST), lv: null };
  setupRun();
  $("barTitle").textContent = "Lunch Rush"; $("rushN").textContent = "0"; $("tickets").innerHTML = "";
  let chars; do { chars = shuffle([...seed]); } while (chars.join("") === seed);
  pot.setLetters(chars); fit();
  showCust(R.cust); say("Everybody's starving. Quick, any word!"); idleChip();
  Sound.rush(); Sound.setSpeed(1.2);
}
const RUSH_TIP = { 3: 3, 4: 5, 5: 10, 6: 16, 7: 30 };
function rushWord(word) {
  if (R.used.has(word)) { chip("bad", word); say(fmt("{W} is already on a table!", word)); Sound.untick(); chipTimer = setTimeout(idleChip, 600); return; }
  if (!WORDS.has(word)) { chip("bad", word); say(esc(rnd(LINES.bad))); Sound.bad(); boil = Math.max(0, boil - 1); pot.boil = boil; chipTimer = setTimeout(idleChip, 600); return; }
  R.used.add(word); R.served++; stats(word);
  const tip = RUSH_TIP[word.length] || 30; R.tips += tip;
  $("rushN").textContent = R.served;
  const t = document.createElement("div"); t.className = "ticket"; t.textContent = word; $("tickets").prepend(t);
  chip("good", word); chipTimer = setTimeout(idleChip, 450);
  let c; do { c = rnd(CAST); } while (c === R.cust); R.cust = c; showCust(c); say(fmt(rnd(LINES.good), word));
  Sound.ding(); Sound.coin();
  if (word.length >= 5) { R.end += 3000; shout("+3 seconds!"); }
  bumpBoil();
}
function tickRush() {
  const left = R.end - performance.now();
  const clamp = Math.max(0, left), pct = Math.min(1, clamp / (RUSH_SECONDS * 1000));
  $("clockFill").style.transform = `scaleX(${pct})`;
  const s = Math.ceil(clamp / 1000); $("clockText").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  if (left <= 0) endRush();
}
function endRush() {
  R.over = true; clearSel(); Sound.setSpeed(1); Sound.done(); confetti();
  const run = R, best = run.served > G.bestRush; if (best) G.bestRush = run.served;
  coins(run.tips); G.served += run.served; save();
  overlayBusy = true;
  setTimeout(() => {
    if (R !== run) return;
    card(`<h2>${run.served ? `${run.served} customer${run.served === 1 ? "" : "s"} fed!` : "Doors closed!"}</h2><p>${best && run.served ? "That's your best rush yet." : run.served ? `Your best is ${G.bestRush}.` : "They'll be back next time."}</p><div class="rows"><div class="total"><span>Tips</span><span>+${run.tips}</span></div></div>`, [{ label: "Back to Regular Service", fn: () => { $("game").classList.remove("rush"); startBowl(); } }]);
  }, calm ? 80 : 900);
}
function showScreen(id) {
  ["home", "game", "book"].forEach(s => { $(s).hidden = s !== id; });
  active = id === "home" ? homePot : id === "game" ? pot : null;
  requestAnimationFrame(fit);
}
function goHome() {
  if (R && R.mode === "rush" && !R.over) { R.over = true; Sound.setSpeed(1); coins(R.tips); G.served += R.served; }
  else if (R && R.key && !R.over) saveProg();
  R = null; clearSel(); $("fx").innerHTML = ""; save(); paintHome(); showScreen("home"); fit();
}
function paintHome() {
  const first = G.level === 1 && !G.served;
  $("playLabel").textContent = first ? "Open the Kitchen" : `Serve Bowl ${G.level}`;
  $("playSub").textContent = first ? "Your first customer is waiting" : `${custFor(G.level).name} is waiting`;
  const doneToday = G.daily.last === today();
  $("dailySub").textContent = doneToday ? "Served. Back tomorrow!" : G.daily.streak && G.daily.last === today(-1) ? `Day ${G.daily.streak + 1} streak` : "New every day";
  $("dailyBtn").classList.toggle("done", doneToday);
  $("bookSub").textContent = `${unlocked().length} of ${SOUPS.length} soups`;
  $("musicBtn").setAttribute("aria-pressed", G.music); $("sfxBtn").setAttribute("aria-pressed", G.sfx);
}
function renderBook() {
  const open = unlocked();
  $("soups").innerHTML = SOUPS.map(s => {
    const has = open.includes(s);
    return `<button class="soup${s.id === G.soup ? " cur" : ""}${has ? "" : " locked"}" data-soup="${s.id}" ${has ? "" : "aria-disabled=\"true\""}><div class="dish" style="background:radial-gradient(${s.b},${s.a})"></div><b>${has ? esc(s.name) : "Secret recipe"}</b><span>${has ? esc(s.note) : `Unlocks at Bowl ${s.at}`}</span></button>`;
  }).join("");
  $("stats").innerHTML = `<div><b>${G.served}</b>Customers fed</div><div><b>${G.words}</b>Words spelled</div><div><b>${esc(G.longest || "None yet")}</b>Longest word</div><div><b>${G.bestRush}</b>Best Lunch Rush</div>`;
}
function typed(e) {
  if ($("game").hidden || !R || overlayBusy || R.over || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (/^[a-zA-Z]$/.test(k)) {
    const ch = k.toUpperCase(), i = pot.items.findIndex((it, n) => it.ch === ch && !selected.includes(n));
    if (i >= 0) { tapMode = true; pick(i); }
  } else if (k === "Backspace" && selected.length) { unpick(); if (!selected.length) { tapMode = false; idleChip(); } }
  else if (k === "Enter" && selected.length) submit();
  else if (k === " ") { e.preventDefault(); doStir(); }
}
function doStir() {
  if (!R || R.over || overlayBusy) return;
  Sound.unlock(); clearSel(); idleChip(); pot.stir(performance.now()); Sound.stir();
}
function loop(t) {
  if (!document.hidden) {
    if (active) active.frame(t);
    if (R && R.mode === "rush" && !R.over && !overlayBusy) tickRush();
  }
  requestAnimationFrame(loop);
}
function boot(saved) {
  load(saved);
  // chip row lives on the stove, just above the pot
  const row = document.createElement("div"); row.className = "chipRow";
  row.innerHTML = `<button class="mini clear" id="clearBtn" hidden>Clear</button><div id="chip" class="idle"></div><button class="mini serve" id="serveBtn" hidden>Serve</button>`;
  document.querySelector(".kitchen").append(row);
  pot = new Pot($("potBox"), { game: true });
  homePot = new Pot($("homePot"));
  bindPot();
  applySoup();
  homePot.setLetters([..."SOUPYUM"]);
  $("serveBtn").addEventListener("click", () => { if (selected.length) submit(); });
  $("clearBtn").addEventListener("click", () => { clearSel(); idleChip(); });
  $("playBtn").addEventListener("click", () => { Sound.unlock(); startBowl(); });
  $("dailyBtn").addEventListener("click", () => { Sound.unlock(); if (G.daily.last === today()) { $("dailySub").textContent = "Served. Back tomorrow!"; return; } startDaily(); });
  $("bookBtn").addEventListener("click", () => { Sound.unlock(); renderBook(); showScreen("book"); });
  $("bookBack").addEventListener("click", () => { paintHome(); showScreen("home"); });
  $("menuBtn").addEventListener("click", goHome);
  $("stirBtn").addEventListener("click", doStir);
  $("pepperBtn").addEventListener("click", () => hint("pepper"));
  $("ladleBtn").addEventListener("click", () => hint("ladle"));
  $("musicBtn").addEventListener("click", () => { Sound.setMusic(!G.music); paintHome(); save(); });
  $("sfxBtn").addEventListener("click", () => { Sound.setSfx(!G.sfx); paintHome(); save(); });
  $("soups").addEventListener("click", e => {
    const b = e.target.closest("[data-soup]"); if (!b) return;
    const s = soupById(b.dataset.soup); if (!unlocked().includes(s)) return;
    G.soup = s.id; applySoup(); save(); renderBook();
  });
  document.addEventListener("pointerdown", () => Sound.unlock(), { once: true });
  addEventListener("keydown", typed);
  addEventListener("resize", fit);
  paintHome(); showScreen("home"); fit();
  requestAnimationFrame(loop);
  window.claude?.hot?.snapshot?.(() => { if (R && R.key && !R.over) saveProg(); return G; });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data);
})();
</script>
